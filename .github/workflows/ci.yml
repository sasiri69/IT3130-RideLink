name: Account Service CI

on:
  push:
    branches: [ "main", "account-service", "feature/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test – Account Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and run unit tests
        run: mvn clean test --no-transfer-progress
        env:
          MONGODB_URI: "mongodb://localhost:27017/ridelink_account_test"
          JWT_SECRET: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
          JWT_EXPIRATION: 86400000
          JWT_REFRESH_EXPIRATION: 604800000

      - name: Upload test report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-service-test-report
          path: target/surefire-reports/
