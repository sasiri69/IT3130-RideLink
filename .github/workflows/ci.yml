name: RideLink Microservices CI Pipeline

on:
  push:
    branches: [ main, develop, "feature/**" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build & Run Automated Unit Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build & Test Account Service (Member 1)
        run: |
          cd account-service
          mvn -B clean test
        env:
          PORT: 8081
          MONGODB_URI: mongodb://localhost:27017/account_db
          JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
          JWT_EXPIRATION: 86400000

      - name: Build & Test Driver & Vehicle Service (Member 2)
        run: |
          cd driver-service
          mvn -B clean test
        env:
          PORT: 8082
          MONGODB_URI: mongodb://localhost:27017/driver_db
          JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
          JWT_EXPIRATION: 86400000
