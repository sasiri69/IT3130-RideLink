spring.application.name=driver-service
server.port=${SERVER_PORT:8082}

# MongoDB Connection - independent persistence boundary (Section 6.1)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ridelink_driver_db}

# JSON Formatting
spring.jackson.serialization.indent-output=true

# Swagger / OpenAPI Path
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# JWT Secret - shared with Account Service for stateless Bearer token validation
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

# Interservice Communication - Account Service URL (Member 1)
services.account.url=${ACCOUNT_SERVICE_URL:http://localhost:8081}
services.account.timeout-ms=${ACCOUNT_SERVICE_TIMEOUT_MS:5000}
