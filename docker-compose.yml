version: '3.8'

services:
  account-service:
    build: .
    container_name: account-service-container
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATA_MONGODB_URI=${MONGO_URI:-mongodb://localhost:27017/ridelink_account_db}
      - JWT_SECRET=${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      - SERVER_PORT=8081
    env_file:
      - .env
    restart: always