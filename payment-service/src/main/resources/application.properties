spring.application.name=payment-service
server.port=${SERVER_PORT:8084}

# MongoDB Connection - independent persistence boundary (Assignment §6.1)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/payment_db}

# JSON Formatting
spring.jackson.serialization.indent-output=true

# Swagger / OpenAPI Path
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# JWT Secret - shared with Account Service for stateless Bearer token validation
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Interservice Communication
services.account.url=${SERVICES_ACCOUNT_URL:http://localhost:8081}
services.ride.url=${SERVICES_RIDE_URL:http://localhost:8083}
